<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion / Inscription — MadaMarket</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <a href="../index.html"><img src="../assets/logo-madamarket.svg" alt="MadaMarket" height="42"></a>
        <a href="../index.html" class="btn-green">← Retour accueil</a>
    </header>

    <main class="container" style="max-width:520px;">
        <div class="panel">
            <h2 style="color:var(--green);margin-bottom:14px;">Connexion MadaMarket</h2>
            <form onsubmit="event.preventDefault(); alert('Prêt pour connexion API /api/auth/login');">
                <div style="margin-bottom:10px;">
                    <label style="display:block;font-weight:600;margin-bottom:4px;">Email ou Téléphone</label>
                    <input type="text" placeholder="ex: 034 00 000 00 ou nom@exemple.mg" required>
                </div>
                <div style="margin-bottom:14px;">
                    <label style="display:block;font-weight:600;margin-bottom:4px;">Mot de passe</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-orange" style="width:100%;">Se connecter</button>
            </form>
        </div>

        <div class="panel">
            <h2 style="color:var(--green);margin-bottom:14px;">Créer un compte</h2>
            <form onsubmit="event.preventDefault(); alert('Prêt pour inscription API /api/auth/register');">
                <div style="margin-bottom:10px;">
                    <label style="display:block;font-weight:600;margin-bottom:4px;">Nom complet</label>
                    <input type="text" placeholder="Votre nom complet" required>
                </div>
                <div style="margin-bottom:10px;">
                    <label style="display:block;font-weight:600;margin-bottom:4px;">Téléphone</label>
                    <input type="tel" placeholder="032 / 033 / 034..." required>
                </div>
                <div style="margin-bottom:10px;">
                    <label style="display:block;font-weight:600;margin-bottom:4px;">Email</label>
                    <input type="email" placeholder="email@madamarket.mg" required>
                </div>
                <div style="margin-bottom:12px;">
                    <label style="display:block;font-weight:600;margin-bottom:4px;">Mot de passe</label>
                    <input type="password" placeholder="Minimum 8 caractères" required>
                </div>
                <label style="display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:0.9rem;">
                    <input type="checkbox" id="wantShop" style="width:auto;" onchange="document.getElementById('shopFields').style.display = this.checked ? 'block' : 'none'">
                    Je souhaite aussi ouvrir une boutique vendeur
                </label>
                <div id="shopFields" style="display:none;margin-bottom:14px;">
                    <input type="text" placeholder="Nom de votre boutique" style="margin-bottom:8px;">
                    <input type="text" placeholder="Ville (ex: Mahajanga, Antananarivo...)">
                </div>
                <button type="submit" class="btn-green" style="width:100%;">S'inscrire</button>
            </form>
        </div>
    </main>
</body>
</html>
